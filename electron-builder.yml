appId: local.subaru.dl
productName: Subaru DL
copyright: Subaru DL
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/bin
    to: bin
    filter: ['**/*']
  - from: resources/icone.png
    to: icone.png
  - from: resources/icone-bandeja.png
    to: icone-bandeja.png
# As versões publicadas no GitHub alimentam a atualização automática (electron-updater)
publish:
  provider: github
  owner: ailtoncja
  repo: subaru-dl
  releaseType: release
win:
  target: nsis
  icon: build/icon.ico
  executableName: SubaruDL
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Subaru DL
  uninstallDisplayName: Subaru DL
  artifactName: Subaru-DL-Setup-${version}.exe
  installerLanguages: [pt_BR]
  language: '1046'
