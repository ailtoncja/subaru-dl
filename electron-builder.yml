appId: local.subaru.dl
productName: Subaru DL
copyright: Subaru DL
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/bin
    to: bin
    filter: ['**/*']
  - from: resources/icone.png
    to: icone.png
  - from: resources/icone-bandeja.png
    to: icone-bandeja.png
# As versões publicadas no GitHub alimentam a atualização automática (electron-updater)
publish:
  provider: github
  owner: ailtoncja
  repo: subaru-dl
  # Sobe como rascunho; o scripts/publicar.mjs publica depois que todos os arquivos chegaram
  releaseType: draft
win:
  target: nsis
  icon: build/icon.ico
  executableName: SubaruDL
  # Com o nome do publicador no app-update.yml, o electron-updater chama a conferência de assinatura do
  # programa (src/main/atualizador.ts), que usa a chave do autor (.sig) em vez de um certificado
  signtoolOptions:
    publisherName: Subaru DL
# Trava recursos do Electron que o programa não usa e que serviriam para rodar outro código com ele
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # grantFileProtocolExtraPrivileges fica como está: sem ele a interface (file:// dentro do app.asar) não abre
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Subaru DL
  uninstallDisplayName: Subaru DL
  artifactName: Subaru-DL-Setup-${version}.exe
  installerLanguages: [pt_BR]
  language: '1046'
